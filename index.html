<html>
  <head>
    <meta charset="utf-8" />
    <script
      id="__ada"
      data-handle="malaysiaairlines-sandbox"
      src="https://static.ada.support/embed2.js"
      async
    ></script>

    <script>
      const SREAC_EVENT = "self_reac";

      const SREAC_HOSTS = [
        "sandbox-api.malaysiaairlines.com",
        "api.malaysiaairlines.com",
      ];

      function redirectToSreac(event) {
        try {
          const url = event?.user_data?.global?.sreac_action;

          if (!url) {
            throw new Error("No sreac_action provided");
          }

          const { hostname } = new URL(url);
          if (!SREAC_HOSTS.includes(hostname)) {
            throw new Error("Host is not allow-listed: " + hostname);
          }

          console.log("Redirecting to", url);
          window.location.href = url;
        } catch (err) {
          console.error("sreac redirect handler error:", err);
        }
      }

      window.adaSettings = {
        eventCallbacks: {
          [SREAC_EVENT]: (event) => {
            console.log("sreac redirect triggered from Ada", event);
            redirectToSreac(event);
          },
        },
      };
    </script>
  </head>
</html>
