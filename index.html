<html>
  <head>
    <meta charset="utf-8" />
    <script
      id="__ada"
      data-handle="malaysiaairlines-sandbox"
      src="https://static.ada.support/embed2.js"
      async
    ></script>

    <script>
      const SREAC_DEBUG = true;

      // "navigate" — send the browser to the MAS endpoint and let its own
      //              self-submitting form do the POST. Needs only pnr and
      //              lastName from the AI Agent. No code tool required.
      // "post"     — rebuild the form here and POST straight to Amadeus. Needs
      //              sreac_action from a code tool (or a SET step).
      const SREAC_MODE = "navigate";

      // navigate mode
      const SREAC_ENDPOINT = "https://sandbox-api.malaysiaairlines.com/refx/sreac/redirection/";
      const SREAC_ENDPOINT_HOSTS = ["sandbox-api.malaysiaairlines.com", "api.malaysiaairlines.com"];

      // post mode
      const SREAC_DEFAULT_URL =
        "https://uat.digital.airline.amadeus.com/mh/servicing/self-reaccommodation/retrieve?lang=en-GB";
      const SREAC_ALLOWED_HOSTS = [
        "uat.digital.airline.amadeus.com",
        "digital.airline.amadeus.com",
      ];

      /* ----------------------------------------------------------- debug UI */
      let panel = null;

      function debugPanel() {
        if (!SREAC_DEBUG || panel || !document.body) return null;
        panel = document.createElement("pre");
        panel.style.cssText =
          "position:fixed;left:12px;bottom:12px;z-index:2147483647;max-width:46vw;" +
          "max-height:44vh;overflow:auto;margin:0;padding:10px 12px;border-radius:8px;" +
          "background:#12161c;color:#e8ecf1;border:1px solid #2b3542;" +
          "font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap";
        panel.textContent = "ada event log\n";
        document.body.appendChild(panel);
        return panel;
      }

      function note(text, isError) {
        console[isError ? "error" : "log"]("[sreac]", text);
        const el = debugPanel();
        if (!el) return;
        const line = document.createElement("div");
        if (isError) line.style.color = "#f87171";
        line.textContent = text;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
      }

      function hostAllowed(url, hosts) {
        return hosts.includes(new URL(url).hostname);
      }

      /* -------------------------------------------------------------- POST */
      function postForm(method, actionUrl, fields) {
        const form = document.createElement("form");
        form.method = method || "POST";
        form.action = actionUrl;
        form.target = "_self";
        form.style.display = "none";

        Object.entries(fields || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === "") return;
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = typeof value === "string" ? value : JSON.stringify(value);
          form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
      }

      /* ------------------------------------------------------------ SREAC */
      function sreacFields(globals) {
        // The code tool, when present, puts the parsed hidden inputs in
        // sreacForm. Otherwise use the two values the Playbook captured.
        if (globals.sreacForm) {
          const parsed =
            typeof globals.sreacForm === "string"
              ? JSON.parse(globals.sreacForm)
              : globals.sreacForm;
          if (parsed && parsed.recLoc && parsed.lastName) return parsed;
          note("sreacForm carried no recLoc/lastName — falling back to pnr + lastName");
        }
        return { recLoc: globals.pnr, lastName: globals.lastName };
      }

      function navigateToEndpoint(fields, lang) {
        if (!hostAllowed(SREAC_ENDPOINT, SREAC_ENDPOINT_HOSTS)) {
          throw new Error("SREAC_ENDPOINT host is not allow-listed");
        }
        const query = new URLSearchParams({
          identifier: fields.recLoc,
          lastName: fields.lastName,
          lang: lang || "en-GB",
        });
        const target = SREAC_ENDPOINT + "?" + query.toString();
        note("navigating to " + target);
        window.location.href = target;
      }

      function postToAmadeus(globals, fields) {
        // "NONE" is the code tool's failure signal. Do not fall back to the
        // hardcoded URL there — posting anyway would look identical to success.
        const raw = globals.sreac_action;
        if (raw === "NONE") {
          throw new Error("The AI Agent could not resolve a redirect target (sreac_action=NONE)");
        }
        const url = raw || SREAC_DEFAULT_URL;
        if (!raw) {
          note("sreac_action not set — FALLING BACK to the hardcoded Amadeus URL. "
            + "This is not the live value from the API.", true);
        }
        if (!hostAllowed(url, SREAC_ALLOWED_HOSTS)) {
          throw new Error("Refusing to POST to un-allow-listed host: " + new URL(url).hostname);
        }
        const method = (globals.sreac_method || "post").toUpperCase();
        note("POST " + url + " " + JSON.stringify(fields));
        postForm(method, url, fields);
      }

      function handleSreac(eventName, event) {
        note("handling " + eventName + " as self-reac, mode=" + SREAC_MODE);

        try {
          const globals = event?.user_data?.global || {};
          const fields = sreacFields(globals);

          if (!fields.recLoc || !fields.lastName) {
            throw new Error(
              "Missing recLoc/lastName. globals seen: " + Object.keys(globals).join(", ")
            );
          }

          if (SREAC_MODE === "navigate") {
            navigateToEndpoint(fields, globals.lang);
          } else {
            postToAmadeus(globals, fields);
          }
        } catch (err) {
          note("self-reac handler error: " + err.message, true);
        }
      }

      /* ---------------------------------------------------------- BOOKING */
      function handleBooking(event) {
        note("handling flight_booking");

        try {
          const globals = event?.user_data?.global || {};
          const method = (globals.method || "post").toUpperCase();
          const platform = globals.platform || "dsp";
          const url = globals.url;

          const fields = {
            search: globals.search,
            flowCode: globals.flowCode,
            flowInfo: globals.flowInfo,
            preferences: globals.preferences,
            userConfig: globals.userConfig,
          };

          if (!url) throw new Error("No booking URL provided");

          note("POST " + url + " platform=" + platform);
          postForm(method, url, fields);
        } catch (err) {
          note("flight_booking handler error: " + err.message, true);
        }
      }

      /* ---------------------------------------------------- event routing */
      // Ada looks the callback up by the event name set on the Handoff. Until
      // that name is confirmed, a Proxy answers for ANY name: every event is
      // logged, and anything that isn't flight_booking is treated as self-reac.
      const handlers = { flight_booking: handleBooking };

      const eventCallbacks = new Proxy(handlers, {
        get(target, prop, receiver) {
          if (typeof prop !== "string" || prop === "then") {
            return Reflect.get(target, prop, receiver);
          }
          if (prop in target) return target[prop];

          return (event) => {
            note("event: " + prop);
            note("  globals: " + JSON.stringify(event?.user_data?.global || {}));
            handleSreac(prop, event);
          };
        },
        has(target, prop) {
          return typeof prop === "string" ? true : Reflect.has(target, prop);
        },
      });

      window.adaSettings = { eventCallbacks };

      if (SREAC_DEBUG) {
        window.addEventListener("DOMContentLoaded", () => {
          note("page ready, mode=" + SREAC_MODE + " — waiting for an Ada event");
        });
      }
    </script>
  </head>

  <body></body>
</html>
