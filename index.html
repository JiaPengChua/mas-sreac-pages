<html>
  <head>
    <meta charset="utf-8" />
    <script
      id="__ada"
      data-handle="malaysiaairlines-sandbox"
      src="https://static.ada.support/embed2.js"
      async
    ></script>

    <script>
      const SREAC_ENDPOINT =
        "https://sandbox-api.malaysiaairlines.com/refx/sreac/redirection/";

      const SREAC_HOSTS = [
        "sandbox-api.malaysiaairlines.com",
        "api.malaysiaairlines.com",
      ];

      const CONTROL_KEYS = ["url", "method", "platform"];

      function postForm(method, actionUrl, fields) {
        const form = document.createElement("form");
        form.method = method || "POST";
        form.action = actionUrl;
        form.target = "_self";
        form.style.display = "none";

        Object.entries(fields || {}).forEach(([key, value]) => {
          if (value === undefined || value === null) return;
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = typeof value === "string" ? value : JSON.stringify(value);
          form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
      }

      function buildSreacUrl(globals) {
        if (!globals.pnr || !globals.lastName) {
          throw new Error("No sreac_action, and no pnr/lastName to build one from");
        }

        const query = new URLSearchParams({
          identifier: globals.pnr,
          lastName: globals.lastName,
          lang: globals.lang || "en-GB",
        });

        return SREAC_ENDPOINT + "?" + query.toString();
      }

      // The endpoint answers with a self-submitting form, so this only has to
      // send the browser there.
      function redirectToSreac(event) {
        try {
          const globals = event?.user_data?.global || {};
          const supplied = globals.sreac_action;
          const usable =
            supplied && supplied !== "NONE" && !supplied.includes("{{");
          const url = usable ? supplied : buildSreacUrl(globals);

          const { hostname } = new URL(url);
          if (!SREAC_HOSTS.includes(hostname)) {
            throw new Error("Host is not allow-listed: " + hostname);
          }

          console.log("Redirecting to", url);
          window.location.href = url;
        } catch (err) {
          console.error("sreac redirect handler error:", err);
        }
      }

      // Every global except the control keys is POSTed, so fields added to the
      // payload later need no change here.
      function redirectToBooking(event) {
        try {
          const globals = event?.user_data?.global || {};
          const method = (globals.method || "post").toUpperCase();
          const url = globals.url;

          if (!url) {
            throw new Error("No booking URL provided");
          }
          if (new URL(url).protocol !== "https:") {
            throw new Error("Booking URL is not https: " + url);
          }

          const fields = {};
          Object.entries(globals).forEach(([key, value]) => {
            if (!CONTROL_KEYS.includes(key)) fields[key] = value;
          });

          console.log("Redirecting via", method, "to", url, fields);

          postForm(method, url, fields);
        } catch (err) {
          console.error("booking redirect handler error:", err);
        }
      }

      window.adaSettings = {
        eventCallbacks: {
          flight_reaccommodation: redirectToSreac,
          flight_booking: redirectToBooking,
          express_booking: redirectToBooking,
        },
      };
    </script>
  </head>

</html>
